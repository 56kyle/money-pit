[project]
name = "money-pit"
version = "0.0.2"
description = "money-pit"
authors = [
    { name = "Kyle Oliver", email = "56kyleoliver@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = [
    "money-pit",
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 1 - Planning"
]
dependencies = [
    "alpaca-py>=0.43.0",
    "keyring>=25.7.0",
    "langchain-core>=0.3.0",
    "loguru>=0.7.3",
    "numpy>=2.0.2",
    "platformdirs>=4.3.8",
    "pdfplumber==0.11.10",
    "pillow>=12.3.0",
    "langgraph>=0.2.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2.1",
    "typer>=0.15.4",
    "typing-extensions>=4.13.2",
    "pydantic-ai>=2.1.0",
    "yfinance>=0.2.66",
    "cvxpy>=1.9.2,<2.0",
    "defusedxml>=0.7.1,<1.0",
    "dnspython==2.8.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.7.0",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pre-commit-hooks>=5.0.0",
    "ruff>=0.11.9",
    "bandit>=1.8.3",
    "pip-audit>=2.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "basedpyright>=1.34.0",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-typer>=0.5.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.8.0",
]
cu128 = [
    "torch>=2.8.0",
]
video = [
    "faster-whisper>=1.2.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "scenedetect>=0.7",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
money-pit = "money_pit.__main__:app"

[project.urls]
Homepage = "https://github.com/56kyle/money-pit"
Repository = "https://github.com/56kyle/money-pit"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"money_pit.prompts" = ["*.md"]

"money_pit.storage.sql" = ["*.sql"]
[tool.pytest.ini_options]
addopts = "-m 'not live and not live_video'"
markers = [
    "live: connects to real Alpaca paper / SMTP; deselected by default (run with -m live and MONEY_PIT_LIVE=1)",
    "live_video: runs real video ingestion (yt-dlp + faster-whisper + scenedetect + VLM) against a pinned public URL; deselected by default (run with -m live_video and MONEY_PIT_LIVE_VIDEO=1 — a separate gate from MONEY_PIT_LIVE, since this tier needs the 'video' extra + a GPU and makes paid VLM calls)",
]
