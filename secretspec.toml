[project]
name = "money-pit"
revision = "1.0"

[providers]
local = "keyring://"
ci_env = "env://"

# `required` is scope-local. SecretSpec enforces a declaration only when the
# application requests a scope that contains it; this profile is not a startup bundle.
[profiles.development]
OPENAI_API_KEY = { description = "OpenAI inference and frame interpretation", required = true, providers = ["local"] }
YOUTUBE_API_KEY = { description = "YouTube Data API access", required = true, providers = ["local"] }
BRAVE_SEARCH_API_KEY = { description = "Brave Search API access", required = true, providers = ["local"] }
FRED_API_KEY = { description = "Federal Reserve Economic Data API access", required = true, providers = ["local"] }
SEC_USER_AGENT = { description = "SEC-compliant application identity", required = true, providers = ["local"] }
IMAP_USERNAME = { description = "Bounded IMAP account username", required = true, providers = ["local"] }
IMAP_PASSWORD = { description = "Bounded IMAP account password", required = true, providers = ["local"] }
ALPACA_PAPER_API_KEY = { description = "Alpaca paper account API key", required = true, providers = ["local"] }
ALPACA_PAPER_SECRET_KEY = { description = "Alpaca paper account secret key", required = true, providers = ["local"] }
ALPACA_LIVE_API_KEY = { description = "Alpaca live account API key", required = true, providers = ["local"] }
ALPACA_LIVE_SECRET_KEY = { description = "Alpaca live account secret key", required = true, providers = ["local"] }

# The CI profile is the same schema with an environment-backed provider. Declaring
# a credential here does not require CI workflows that never request its scope to inject it.
[profiles.ci]
OPENAI_API_KEY = { description = "OpenAI inference and frame interpretation", required = true, providers = ["ci_env"] }
YOUTUBE_API_KEY = { description = "YouTube Data API access", required = true, providers = ["ci_env"] }
BRAVE_SEARCH_API_KEY = { description = "Brave Search API access", required = true, providers = ["ci_env"] }
FRED_API_KEY = { description = "Federal Reserve Economic Data API access", required = true, providers = ["ci_env"] }
SEC_USER_AGENT = { description = "SEC-compliant application identity", required = true, providers = ["ci_env"] }
IMAP_USERNAME = { description = "Bounded IMAP account username", required = true, providers = ["ci_env"] }
IMAP_PASSWORD = { description = "Bounded IMAP account password", required = true, providers = ["ci_env"] }
ALPACA_PAPER_API_KEY = { description = "Alpaca paper account API key", required = true, providers = ["ci_env"] }
ALPACA_PAPER_SECRET_KEY = { description = "Alpaca paper account secret key", required = true, providers = ["ci_env"] }
ALPACA_LIVE_API_KEY = { description = "Alpaca live account API key", required = true, providers = ["ci_env"] }
ALPACA_LIVE_SECRET_KEY = { description = "Alpaca live account secret key", required = true, providers = ["ci_env"] }

[scopes.inference]
secrets = ["OPENAI_API_KEY"]
[scopes.youtube_discovery]
secrets = ["YOUTUBE_API_KEY"]
[scopes.imap]
secrets = ["IMAP_USERNAME", "IMAP_PASSWORD"]
[scopes.brave]
secrets = ["BRAVE_SEARCH_API_KEY"]
[scopes.edgar]
secrets = ["SEC_USER_AGENT"]
[scopes.fred]
secrets = ["FRED_API_KEY"]
[scopes.portfolio_paper]
secrets = ["ALPACA_PAPER_API_KEY", "ALPACA_PAPER_SECRET_KEY"]
[scopes.portfolio_live]
secrets = ["ALPACA_LIVE_API_KEY", "ALPACA_LIVE_SECRET_KEY"]
[scopes.execution_paper]
secrets = ["ALPACA_PAPER_API_KEY", "ALPACA_PAPER_SECRET_KEY"]
[scopes.execution_live]
secrets = ["ALPACA_LIVE_API_KEY", "ALPACA_LIVE_SECRET_KEY"]
