[project]
name = "money-pit"
version = "0.0.0"
description = "money-pit"
authors = [
    { name = "Kyle Oliver", email = "56kyleoliver@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = [
    "money-pit",
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "alpaca-py>=0.43.0",
    "keyring>=25.7.0",
    "lightning>=2.6.0",
    "loguru>=0.7.3",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pandas-stubs>=2.2.2.240807",
    "platformdirs>=4.3.8",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    "typer>=0.15.4",
    "typing-extensions>=4.13.2",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "commitizen>=4.7.0",
    "nox>=2025.5.1",
    "pre-commit>=4.2.0",
    "pre-commit-hooks>=5.0.0",
    "ruff>=0.11.9",
    "bandit>=1.8.3",
    "pip-audit>=2.9.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pyright>=1.1.400",
]
docs = [
    "furo>=2024.8.6",
    "myst-parser>=3.0.1",
    "sphinx>=7.4.7",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=2.3.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-tabs>=3.4.7",
    "sphinxcontrib-typer>=0.5.1",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.8.0",
]
cu128 = [
    "torch>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/56kyle/money-pit"
Repository = "https://github.com/56kyle/money-pit"

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
